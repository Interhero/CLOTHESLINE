<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CLOTHESLINE SMART DRY — Apple Home Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
    rel="stylesheet">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Apple Home Ambient Dynamic Wallpaper */
    .apple-home-bg {
      background: linear-gradient(170deg, #4b7ea8 0%, #6899c7 28%, #b38e78 65%, #d19a79 88%, #c58661 100%);
      background-attachment: fixed;
    }

    /* Apple Frosted Glass */
    .glass-tile-inactive {
      background: rgba(18, 24, 38, 0.42);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.18);
    }

    .glass-tile-inactive:hover {
      background: rgba(25, 34, 52, 0.52);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .glass-tile-active {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      box-shadow: 0 10px 30px -4px rgba(0, 0, 0, 0.22), 0 2px 8px -2px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.95);
    }

    /* Apple Home Squircle Radius */
    .apple-squircle {
      border-radius: 24px;
    }

    .apple-squircle-sm {
      border-radius: 18px;
    }

    /* Fan spinning speeds */
    @keyframes fan-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .fan-low {
      animation: fan-spin 2s linear infinite;
    }

    .fan-medium {
      animation: fan-spin 0.9s linear infinite;
    }

    .fan-high {
      animation: fan-spin 0.35s linear infinite;
    }

    /* Rain simulation */
    @keyframes rain-fall {
      0% {
        transform: translateY(-10px);
        opacity: 0;
      }

      20% {
        opacity: 0.85;
      }

      100% {
        transform: translateY(140px);
        opacity: 0;
      }
    }

    .rain-drop {
      animation: rain-fall 0.75s linear infinite;
    }

    /* Fluid Cloth Sway Animations */
    @keyframes cloth-idle {

      0%,
      100% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(2deg);
      }
    }

    @keyframes cloth-sway-low {

      0%,
      100% {
        transform: rotate(-2.5deg);
      }

      50% {
        transform: rotate(4.5deg);
      }
    }

    @keyframes cloth-sway-med {

      0%,
      100% {
        transform: rotate(-4deg);
      }

      50% {
        transform: rotate(8deg);
      }
    }

    @keyframes cloth-sway-high {

      0%,
      100% {
        transform: rotate(-6deg);
      }

      50% {
        transform: rotate(13deg);
      }
    }

    .sway-idle {
      animation: cloth-idle 3s ease-in-out infinite;
      transform-origin: 0px 0px;
    }

    .sway-low {
      animation: cloth-sway-low 1.8s ease-in-out infinite;
      transform-origin: 0px 0px;
    }

    .sway-med {
      animation: cloth-sway-med 1.1s ease-in-out infinite;
      transform-origin: 0px 0px;
    }

    .sway-high {
      animation: cloth-sway-high 0.75s ease-in-out infinite;
      transform-origin: 0px 0px;
    }

    /* Wind breeze line dash flow */
    @keyframes wind-flow {
      from {
        stroke-dashoffset: 28;
      }

      to {
        stroke-dashoffset: 0;
      }
    }

    .wind-streaming {
      animation: wind-flow 0.85s linear infinite;
    }

    .wind-streaming-fast {
      animation: wind-flow 0.4s linear infinite;
    }

    /* Fluid Orange Icon breathing / wave animation */
    @keyframes orange-fluid-wave {

      0%,
      100% {
        transform: scale(1) rotate(0deg);
        filter: drop-shadow(0 0 4px rgba(255, 149, 0, 0.4));
      }

      50% {
        transform: scale(1.06) rotate(3deg);
        filter: drop-shadow(0 0 10px rgba(255, 149, 0, 0.75));
      }
    }

    .orange-fluid {
      animation: orange-fluid-wave 2.2s ease-in-out infinite;
      transform-origin: center;
    }

    /* Flowing rain safe boundary */
    @keyframes dash-flow {
      to {
        stroke-dashoffset: -20;
      }
    }

    .rain-safe-flowing {
      animation: dash-flow 1.5s linear infinite;
    }

    /* Smooth transition */
    .rod-animate {
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.25, 1);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>

<body class="apple-home-bg min-h-screen text-white antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const MODES = {
      'Quick Dry': { fan: 3, rod: 100, timer: 90, loadKg: 2.4, desc: 'Maximum airflow for rapid drying', icon: 'zap', color: '#ff9500' },
      'Delicate Fabrics': { fan: 1, rod: 100, timer: 120, loadKg: 1.5, desc: 'Gentle low-speed air for lighter items', icon: 'feather', color: '#af52de' },
      'Heavy Laundry': { fan: 3, rod: 100, timer: 180, loadKg: 4.6, desc: 'Extended high-speed cycle for thick bedding', icon: 'layers', color: '#007aff' },
      'Eco Air-Dry': { fan: 1, rod: 100, timer: 240, loadKg: 2.2, desc: 'Energy-saving air drying with lower noise', icon: 'leaf', color: '#34c759' },
      'Night Silent': { fan: 1, rod: 100, timer: 120, loadKg: 1.8, desc: 'Whisper-quiet fan speed with muted alerts', icon: 'moon', color: '#5856d6' }
    };

    const FAN_LABELS = ['Off', 'Low', 'Med', 'High'];
    const CLIENT_ID = 'clothesline_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now().toString(36);

    function AppleHomeApp() {
      const getInitialHomeId = () => {
        try {
          const params = new URLSearchParams(window.location.search);
          const h = params.get('home') || params.get('room');
          if (h && h.trim()) return h.trim().toLowerCase();
        } catch (_) {}
        return 'ent600-home';
      };

      // System States
      const [homeId, setHomeId] = useState(getInitialHomeId);
      const [syncStatus, setSyncStatus] = useState('connecting');
      const [showSyncModal, setShowSyncModal] = useState(false);
      const [copiedLink, setCopiedLink] = useState(false);
      const [roomInput, setRoomInput] = useState(homeId);
      const iotClientRef = useRef(null);

      const [systemPower, setSystemPower] = useState(true);
      const [fanSpeed, setFanSpeed] = useState(2);
      const [rodPositionPercent, setRodPositionPercent] = useState(75);
      const [rodTargetPercent, setRodTargetPercent] = useState(75);
      const [rainDetected, setRainDetected] = useState(false);
      const [autoRainProtection, setAutoRainProtection] = useState(true);
      const [shelteredPositionPercent, setShelteredPositionPercent] = useState(25);
      const [temperatureF, setTemperatureF] = useState(68);
      const [temperatureC, setTemperatureC] = useState(29.2);
      const [humidityPercent, setHumidityPercent] = useState(68);
      const [laundryLoadKg, setLaundryLoadKg] = useState(2.4);
      const [dryingProgressPercent, setDryingProgressPercent] = useState(42);
      const [remainingMinutes, setRemainingMinutes] = useState(58);
      const [totalMinutes, setTotalMinutes] = useState(90);
      const [selectedMode, setSelectedMode] = useState('Quick Dry');
      const [motorStatus, setMotorStatus] = useState('Idle');
      const [obstacleDetected, setObstacleDetected] = useState(false);
      const [emergencyStop, setEmergencyStop] = useState(false);
      const [timerRunning, setTimerRunning] = useState(true);
      const [currentTime, setCurrentTime] = useState(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));

      const [alerts, setAlerts] = useState([
        { id: 1, level: 'info', text: 'Balcony Smart Rack online and responding.', time: '11:30 AM' },
        { id: 2, level: 'info', text: 'All sensors calibrated. 3-rod mechanism ready.', time: '11:31 AM' }
      ]);

      const alertIdCounter = useRef(3);

      const addAlert = useCallback((level, text) => {
        const newAlert = {
          id: alertIdCounter.current++,
          level,
          text,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setAlerts(prev => [newAlert, ...prev].slice(0, 30));
      }, []);

      // Clock
      useEffect(() => {
        const t = setInterval(() => {
          setCurrentTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        }, 1000);
        return () => clearInterval(t);
      }, []);

      // Smooth 40Hz Motor Rod Engine
      useEffect(() => {
        const interval = setInterval(() => {
          if (!systemPower) return;
          if (emergencyStop || obstacleDetected) {
            if (motorStatus === 'Moving') setMotorStatus('Stopped');
            return;
          }
          if (laundryLoadKg > 5.0) {
            if (motorStatus === 'Moving') {
              setMotorStatus('Fault');
              addAlert('critical', 'Load limit reached: exceeds 5.0 kg structural rating.');
            }
            return;
          }

          setRodPositionPercent(curr => {
            const diff = rodTargetPercent - curr;
            if (Math.abs(diff) <= 0.8) {
              if (motorStatus === 'Moving') {
                setMotorStatus('Idle');
                if (curr === shelteredPositionPercent && rainDetected) {
                  addAlert('high', 'Rack auto-sheltered under protective roof (25%).');
                }
              }
              return rodTargetPercent;
            }
            setMotorStatus('Moving');
            const step = Math.sign(diff) * Math.min(Math.abs(diff), 1.4);
            return +(curr + step).toFixed(2);
          });
        }, 25);

        return () => clearInterval(interval);
      }, [rodTargetPercent, systemPower, emergencyStop, obstacleDetected, laundryLoadKg, motorStatus, rainDetected, shelteredPositionPercent, addAlert]);

      // Telemetry Countdown Engine
      useEffect(() => {
        const interval = setInterval(() => {
          if (!systemPower) return;

          if (timerRunning && remainingMinutes > 0) {
            setRemainingMinutes(prev => {
              const next = Math.max(0, +(prev - 0.2).toFixed(1));
              if (next === 0) {
                setFanSpeed(0);
                setTimerRunning(false);
                addAlert('info', 'Drying cycle finished. Fan shut off.');
              }
              return next;
            });

            setDryingProgressPercent(prev => {
              const humidityFactor = 1 - (humidityPercent - 50) / 200;
              const speedMultiplier = fanSpeed === 0 ? 0.05 : (fanSpeed * 0.18);
              return Math.min(100, +(prev + speedMultiplier * humidityFactor).toFixed(1));
            });
          }

          // Gentle ambient drift
          setTemperatureC(t => +(t + (Math.random() - 0.5) * 0.1).toFixed(1));
          setTemperatureF(f => Math.round(68 + (Math.random() - 0.5) * 1.5));
          setHumidityPercent(h => Math.min(98, Math.max(25, +(h + (Math.random() - 0.5) * 0.2).toFixed(0))));
        }, 1000);

        return () => clearInterval(interval);
      }, [systemPower, timerRunning, remainingMinutes, fanSpeed, humidityPercent, addAlert]);

      // Auto-Rain Watcher
      useEffect(() => {
        if (rainDetected && autoRainProtection && systemPower && !emergencyStop) {
          addAlert('high', 'Rain detected! Retracting rack to 25% rain-safe shelter.');
          setRodTargetPercent(shelteredPositionPercent);
        }
      }, [rainDetected, autoRainProtection, systemPower, emergencyStop, shelteredPositionPercent, addAlert]);

      // Auto Turn-Off Fan When Rack Is Folded
      useEffect(() => {
        if (rodPositionPercent <= 5 && fanSpeed > 0) {
          setFanSpeed(0);
          addAlert('info', 'Rack folded against wall: Fan automatically shut off.');
        }
      }, [rodPositionPercent, fanSpeed, addAlert]);

      // ─── Real-Time Multi-Device IoT Cloud Synchronization ───
      const publishAction = useCallback((type, payload = {}) => {
        if (!iotClientRef.current || syncStatus !== 'connected') return;
        try {
          const msg = { type, payload, senderId: CLIENT_ID, timestamp: Date.now() };
          iotClientRef.current.publish(`ent600/clothesline/${homeId}/actions`, JSON.stringify(msg), { qos: 0 });
        } catch (e) {
          console.warn('[IoT Sync] publish failed', e);
        }
      }, [homeId, syncStatus]);

      useEffect(() => {
        if (!window.mqtt) {
          setSyncStatus('offline');
          return;
        }

        const brokerUrl = 'wss://broker.hivemq.com:8884/mqtt';
        const topicPrefix = `ent600/clothesline/${homeId}`;

        let client;
        try {
          client = window.mqtt.connect(brokerUrl, {
            clientId: CLIENT_ID,
            clean: true,
            connectTimeout: 5000,
            reconnectPeriod: 4000
          });
          iotClientRef.current = client;

          client.on('connect', () => {
            setSyncStatus('connected');
            client.subscribe(`${topicPrefix}/actions`, { qos: 0 });
            client.subscribe(`${topicPrefix}/state`, { qos: 0 });
            // Request peer state
            client.publish(`${topicPrefix}/actions`, JSON.stringify({
              type: 'REQUEST_STATE',
              senderId: CLIENT_ID,
              timestamp: Date.now()
            }));
          });

          client.on('message', (topic, payload) => {
            try {
              const data = JSON.parse(payload.toString());
              if (!data || data.senderId === CLIENT_ID) return;

              if (topic === `${topicPrefix}/actions`) {
                if (data.type === 'REQUEST_STATE') {
                  // Broadcast state snapshot
                  const snapshot = {
                    systemPower,
                    fanSpeed,
                    rodPositionPercent,
                    rodTargetPercent,
                    rainDetected,
                    autoRainProtection,
                    shelteredPositionPercent,
                    laundryLoadKg,
                    selectedMode,
                    motorStatus,
                    obstacleDetected,
                    emergencyStop,
                    timerRunning
                  };
                  client.publish(`${topicPrefix}/state`, JSON.stringify({
                    state: snapshot,
                    senderId: CLIENT_ID,
                    timestamp: Date.now()
                  }), { qos: 0, retain: true });
                } else {
                  handleRemoteAction(data);
                }
              } else if (topic === `${topicPrefix}/state`) {
                if (data.state) {
                  handleRemoteSnapshot(data.state);
                }
              }
            } catch (err) {
              console.warn('[IoT Sync] message parse error', err);
            }
          });

          client.on('error', () => setSyncStatus('offline'));
          client.on('close', () => setSyncStatus('offline'));
          client.on('reconnect', () => setSyncStatus('connecting'));
        } catch (e) {
          setSyncStatus('offline');
        }

        return () => {
          if (client) {
            try { client.end(true); } catch (_) {}
          }
        };
      }, [homeId]);

      const handleRemoteAction = (action) => {
        const { type, payload } = action;
        if (type === 'TOGGLE_POWER') {
          setSystemPower(payload.systemPower);
          addAlert('info', payload.systemPower ? '📱 Remote: Smart Rack powered ON.' : '📱 Remote: Smart Rack turned OFF.');
        } else if (type === 'SET_FAN_SPEED') {
          setFanSpeed(payload.speed);
          addAlert('info', `📱 Remote: Fan speed set to ${FAN_LABELS[payload.speed]}.`);
        } else if (type === 'SET_ROD_TARGET') {
          setRodTargetPercent(payload.percent);
          addAlert('info', `📱 Remote: Rack stroke set to ${Math.round(payload.percent)}%.`);
        } else if (type === 'SET_POWER_STATE_DEMO') {
          handleDemoPowerState(payload.targetState, true);
        } else if (type === 'EMERGENCY_STOP') {
          setEmergencyStop(payload.emergencyStop);
          if (payload.emergencyStop) {
            setMotorStatus('Stopped');
            setTimerRunning(false);
            addAlert('critical', '🚨 Remote: Emergency Stop engaged!');
          } else {
            setMotorStatus('Idle');
            addAlert('info', '📱 Remote: Emergency Stop released.');
          }
        } else if (type === 'SELECT_MODE') {
          handleSelectMode(payload.modeName, true);
        } else if (type === 'SIMULATE_RAIN') {
          setRainDetected(payload.on);
          addAlert('high', payload.on ? '🌧 Remote: Rain detected!' : '☀️ Remote: Rain cleared.');
        } else if (type === 'SIMULATE_OBSTACLE') {
          setObstacleDetected(payload.on);
          if (payload.on) {
            setMotorStatus('Stopped');
            addAlert('critical', '⚠️ Remote: Obstacle sensor tripped!');
          } else {
            setMotorStatus('Idle');
            addAlert('info', '✅ Remote: Obstacle cleared.');
          }
        } else if (type === 'TOGGLE_AUTO_RAIN') {
          setAutoRainProtection(payload.autoRainProtection);
        } else if (type === 'RESET_DEMO') {
          handleResetDemo(true);
        }
      };

      const handleRemoteSnapshot = (snap) => {
        if (!snap) return;
        if (snap.systemPower !== undefined) setSystemPower(snap.systemPower);
        if (snap.fanSpeed !== undefined) setFanSpeed(snap.fanSpeed);
        if (snap.rodPositionPercent !== undefined) setRodPositionPercent(snap.rodPositionPercent);
        if (snap.rodTargetPercent !== undefined) setRodTargetPercent(snap.rodTargetPercent);
        if (snap.rainDetected !== undefined) setRainDetected(snap.rainDetected);
        if (snap.autoRainProtection !== undefined) setAutoRainProtection(snap.autoRainProtection);
        if (snap.laundryLoadKg !== undefined) setLaundryLoadKg(snap.laundryLoadKg);
        if (snap.selectedMode !== undefined) setSelectedMode(snap.selectedMode);
        if (snap.emergencyStop !== undefined) setEmergencyStop(snap.emergencyStop);
        addAlert('info', '☁️ Synced live state from Home Cloud.');
      };

      // Handlers
      const handlePowerToggle = () => {
        setSystemPower(p => {
          const next = !p;
          addAlert('info', next ? 'Smart Rack powered on.' : 'Smart Rack turned off.');
          publishAction('TOGGLE_POWER', { systemPower: next });
          if (!next) {
            setFanSpeed(0);
            setTimerRunning(false);
            setMotorStatus('Idle');
          }
          return next;
        });
      };

      const handleOpen = () => {
        if (!systemPower || emergencyStop) return;
        if (laundryLoadKg > 5.0) {
          addAlert('critical', 'Overload protection: Cannot extend while overloaded.');
          return;
        }
        addAlert('info', 'Opening rack to 100% extended stroke.');
        publishAction('SET_ROD_TARGET', { percent: 100 });
        setRodTargetPercent(100);
      };

      const handleFold = () => {
        if (!systemPower || emergencyStop) return;
        addAlert('info', 'Retracting rack completely to wall (0%). Fan automatically shut off.');
        publishAction('SET_ROD_TARGET', { percent: 0 });
        setFanSpeed(0);
        setRodTargetPercent(0);
      };

      const handleEmergencyStop = () => {
        setEmergencyStop(e => {
          const next = !e;
          publishAction('EMERGENCY_STOP', { emergencyStop: next });
          if (next) {
            addAlert('critical', 'Emergency Stop engaged! All motion locked.');
            setMotorStatus('Stopped');
            setTimerRunning(false);
          } else {
            addAlert('info', 'Emergency Stop released.');
            setMotorStatus('Idle');
          }
          return next;
        });
      };

      const handleSelectMode = (modeName, isRemote = false) => {
        if (!systemPower) return;
        const cfg = MODES[modeName];
        setSelectedMode(modeName);
        setFanSpeed(cfg.fan);
        setRodTargetPercent(cfg.rod);
        setRemainingMinutes(cfg.timer);
        setTotalMinutes(cfg.timer);
        setDryingProgressPercent(10);
        setTimerRunning(true);
        if (cfg.loadKg !== undefined) {
          setLaundryLoadKg(cfg.loadKg);
        }
        if (!isRemote) {
          publishAction('SELECT_MODE', { modeName });
          if (modeName === 'Heavy Laundry') {
            addAlert('info', `Scene set: Heavy Laundry. Load sensor updated to ${cfg.loadKg} kg (92% load).`);
          } else {
            addAlert('info', `Scene set: ${modeName} (${FAN_LABELS[cfg.fan]} Fan, ${cfg.timer}m).`);
          }
        } else {
          addAlert('info', `📱 Remote: Scene changed to ${modeName}.`);
        }
      };

      const handleSimulateRain = (isRain) => {
        setRainDetected(isRain);
        publishAction('SIMULATE_RAIN', { on: isRain });
        if (!isRain) addAlert('info', 'Rain cleared. Outdoor drying safe.');
      };

      const handleSimulateObstacle = (hasObstacle) => {
        setObstacleDetected(hasObstacle);
        publishAction('SIMULATE_OBSTACLE', { on: hasObstacle });
        if (hasObstacle) {
          addAlert('critical', 'Obstacle detected! Motion locked for safety.');
          setMotorStatus('Stopped');
        } else {
          addAlert('info', 'Obstacle cleared.');
          setMotorStatus('Idle');
        }
      };

      const handleResetDemo = (isRemote = false) => {
        setSystemPower(true);
        setFanSpeed(2);
        setRodPositionPercent(75);
        setRodTargetPercent(75);
        setRainDetected(false);
        setAutoRainProtection(true);
        setShelteredPositionPercent(25);
        setTemperatureF(68);
        setTemperatureC(29.2);
        setHumidityPercent(68);
        setLaundryLoadKg(2.4);
        setDryingProgressPercent(42);
        setRemainingMinutes(58);
        setTotalMinutes(90);
        setSelectedMode('Quick Dry');
        setMotorStatus('Idle');
        setObstacleDetected(false);
        setEmergencyStop(false);
        setTimerRunning(true);
        if (!isRemote) {
          publishAction('RESET_DEMO', {});
          addAlert('info', 'All accessories and scenes reset to defaults.');
        } else {
          addAlert('info', '📱 Remote: Reset all states to defaults.');
        }
      };

      // Derived 3-Tier System Power & Operational State
      const powerState = !systemPower
        ? 'Offline'
        : (fanSpeed > 0 || timerRunning || motorStatus === 'Moving')
          ? 'Online'
          : 'Standby';

      // Demo Scene Controller for FYP Presentation
      const handleDemoPowerState = (targetState, isRemote = false) => {
        if (!isRemote) {
          publishAction('SET_POWER_STATE_DEMO', { targetState });
        }
        if (targetState === 'Standby') {
          setSystemPower(true);
          setFanSpeed(0);
          setTimerRunning(false);
          setMotorStatus('Idle');
          if (!isRemote) addAlert('info', 'Scene Demo: System is in STANDBY (Connected & ready for commands).');
        } else if (targetState === 'Online') {
          setSystemPower(true);
          if (rodPositionPercent <= 5) setRodTargetPercent(75);
          setFanSpeed(2);
          setTimerRunning(true);
          if (!isRemote) addAlert('info', 'Scene Demo: System is ONLINE (Active drying cycle in progress).');
        } else if (targetState === 'Offline') {
          setSystemPower(false);
          setFanSpeed(0);
          setTimerRunning(false);
          setMotorStatus('Idle');
          if (!isRemote) addAlert('info', 'Scene Demo: System is OFFLINE (Power disconnected / idle shutdown).');
        }
      };

      const shareUrl = typeof window !== 'undefined'
        ? `${window.location.origin}${window.location.pathname}?home=${homeId}`
        : '';

      const handleCopyLink = () => {

                </div>

                {/* SCENE DEMO: 3-TIER POWER & SYSTEM STATE DEMO SWITCHER */}
                <div className="mb-2.5 p-3 rounded-2xl bg-black/25 backdrop-blur-xl border border-white/15">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-white/95">⚡ Scene Demo: Power State</span>
                    <span className="text-[10px] font-mono font-bold text-[#5ac8fa]">Active: {powerState}</span>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <button
                      onClick={() => handleDemoPowerState('Standby')}
                      className={`py-1.5 px-2 rounded-xl text-xs font-semibold transition active:scale-95 border flex items-center justify-center gap-1.5 ${powerState === 'Standby'
                        ? 'bg-[#34c759] text-slate-950 border-[#34c759] shadow-md font-bold'
                        : 'bg-white/10 hover:bg-white/20 text-white/80 border-white/10'
                        }`}
                    >
                      <span className={`w-1.5 h-1.5 rounded-full ${powerState === 'Standby' ? 'bg-slate-950' : 'bg-[#34c759]'}`}></span>
                      <span>Standby</span>
                    </button>
                    <button
                      onClick={() => handleDemoPowerState('Online')}
                      className={`py-1.5 px-2 rounded-xl text-xs font-semibold transition active:scale-95 border flex items-center justify-center gap-1.5 ${powerState === 'Online'
                        ? 'bg-[#00c7be] text-slate-950 border-[#00c7be] shadow-md font-bold'
                        : 'bg-white/10 hover:bg-white/20 text-white/80 border-white/10'
                        }`}
                    >
                      <span className={`w-1.5 h-1.5 rounded-full ${powerState === 'Online' ? 'bg-slate-950' : 'bg-[#00c7be]'}`}></span>
                      <span>Online</span>
                    </button>
                    <button
                      onClick={() => handleDemoPowerState('Offline')}
                      className={`py-1.5 px-2 rounded-xl text-xs font-semibold transition active:scale-95 border flex items-center justify-center gap-1.5 ${powerState === 'Offline'
                        ? 'bg-slate-400 text-slate-950 border-slate-400 shadow-md font-bold'
                        : 'bg-white/10 hover:bg-white/20 text-white/80 border-white/10'
                        }`}
                    >
                      <span className={`w-1.5 h-1.5 rounded-full ${powerState === 'Offline' ? 'bg-slate-950' : 'bg-slate-500'}`}></span>
                      <span>Offline</span>
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2.5">
                  <button
                    onClick={() => handleSimulateRain(!rainDetected)}
                    className="apple-squircle p-3 bg-black/25 backdrop-blur-xl border border-white/15 hover:bg-black/35 text-left transition active:scale-95"
                  >
                    <div className="text-xs font-bold text-white">🌧 Test Rain Sensor</div>
                    <div className="text-[11px] text-white/60">{rainDetected ? 'Clear Weather' : 'Simulate Rain (25%)'}</div>
                  </button>

                  <button
                    onClick={() => handleSimulateObstacle(!obstacleDetected)}
                    className="apple-squircle p-3 bg-black/25 backdrop-blur-xl border border-white/15 hover:bg-black/35 text-left transition active:scale-95"
                  >
                    <div className="text-xs font-bold text-white">⚠ Test Obstacle Lock</div>
                    <div className="text-[11px] text-white/60">{obstacleDetected ? 'Clear Obstacle' : 'Trigger Obstacle'}</div>
                  </button>

                  <button
                    onClick={() => setAutoRainProtection(p => !p)}
                    className="apple-squircle p-3 bg-black/25 backdrop-blur-xl border border-white/15 hover:bg-black/35 text-left transition active:scale-95"
                  >
                    <div className="text-xs font-bold text-white">☂ Auto Rain Guard</div>
                    <div className="text-[11px] text-white/60">{autoRainProtection ? 'Enabled (25% Safe)' : 'Disabled'}</div>
                  </button>

                  <button
                    onClick={handleResetDemo}
                    className="apple-squircle p-3 bg-black/25 backdrop-blur-xl border border-white/15 hover:bg-black/35 text-left transition active:scale-95"
                  >
                    <div className="text-xs font-bold text-white">↺ Reset All States</div>
                    <div className="text-[11px] text-white/60">Restore Defaults</div>
                  </button>
                </div>
              </div>


              {/* SECTION 4: ACTIVITY LOG (APPLE HOME NOTIFICATION STREAM) */}
              <div>
                <div className="flex items-center justify-between mb-2 px-1">
                  <div className="flex items-center gap-1.5 text-white/95 font-bold text-base sm:text-lg">
                    <span>Recent Activity</span>
                    <svg className="w-4 h-4 text-white/60" viewBox="0 0 20 20" fill="currentColor">
                      <path fillRule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clipRule="evenodd" />
                    </svg>
                  </div>
                  <button onClick={() => setAlerts([])} className="text-xs text-white/70 hover:text-white underline">
                    Clear
                  </button>
                </div>

                <div className="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                  {alerts.map(a => (
                    <div
                      key={a.id}
                      className="apple-squircle-sm px-3.5 py-2 bg-black/30 backdrop-blur-xl border border-white/10 text-xs flex items-center justify-between gap-2"
                    >
                      <div className="flex items-center gap-2 min-w-0">
                        <span className={`w-2 h-2 rounded-full shrink-0 ${a.level === 'critical' ? 'bg-[#ff3b30]' :
                          a.level === 'high' ? 'bg-[#007aff]' : 'bg-[#34c759]'
                          }`}></span>
                        <span className="text-white/90 truncate">{a.text}</span>
                      </div>
                      <span className="text-[10px] text-white/50 shrink-0 font-mono">{a.time}</span>
                    </div>
                  ))}
                </div>
              </div>

            </div>

          </div>

          {/* ═══════════ APPLE HOME FOOTER ═══════════ */}
          <footer className="text-center text-xs text-white/60 pt-4 pb-2">
            <p>CLOTHESLINE — SMART DRY • Designed with Apple HomeKit Human Interface Guidelines</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppleHomeApp />);
  </script>
</body>

</html>
